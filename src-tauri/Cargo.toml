[package]
name = "opensnapgene"
version = "0.1.0"
description = "OpenSnapGene desktop shell"
authors = ["Qiu Shui"]
license = "MIT"
repository = "https://github.com/ArchitektSpeer/OpenSnapGene"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "opensnapgene_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
